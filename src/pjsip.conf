[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Šablona pro endpointy ---
[endpoint-template](!)
type=endpoint
context=time-routing
disallow=all
allow=ulaw,alaw
auth=auth-template
aors=aor-template

; --- Šablona pro autentizaci ---
[auth-template](!)
type=auth
auth_type=userpass

; --- Šablona pro AOR (registrace) ---
[aor-template](!)
type=aor
max_contacts=1

; --- Linka 101 (Recepce) ---
[101](endpoint-template)
auth=auth101
aors=101

[auth101](auth-template)
username=101
password=heslo123

[101](aor-template)

; --- Linka 102 (Volající klient) ---
[102](endpoint-template)
auth=auth102
aors=102

[auth102](auth-template)
username=102
password=heslo123

[102](aor-template)
