[general]
static=yes
writeprotect=no

[globals]
RECEPTION_EXT=PJSIP/101

[time-routing]
; Časově podmíněné směrování (Po-Pá 08:00-16:00)
exten => 200,1,NoOp(--- Příchozí hovor: Kontrola pracovní doby ---)
 same => n,GotoIfTime(08:00-16:00,mon-fri,*,*?open:closed)

; Otevřeno - volání recepce
 same => n(open),NoOp(--- Stav: OTEVŘENO ---)
 same => n,Dial(${RECEPTION_EXT},20)
 same => n,Hangup()

; Zavřeno - mimo pracovní dobu
 same => n(closed),NoOp(--- Stav: ZAVŘENO ---)
 same => n,Playback(tt-monkeys)
 same => n,Hangup()
