[general]
static=yes
writeprotect=no

[globals]
RECEPTION_EXT=PJSIP/101

[time-routing]
exten => 200,1,NoOp(--- Kontrola casu, fronty a schranky ---)
 same => n,GotoIfTime(08:00-16:00,mon-fri,*,*?open:closed)

; Otevřeno - hovor jde do fronty na 30 vteřin
 same => n(open),NoOp(--- OTEVŘENO: Vstup do fronty ---)
 same => n,Queue(recepce_fronta,t,,,30)
 same => n,Goto(closed) ; Pokud frontu nikdo nezvedne, jdi do schránky

; Zavřeno - hovor jde do hlasové schránky
 same => n(closed),NoOp(--- ZAVŘENO: Voicemail ---)
 same => n,Playback(tt-monkeys)
 same => n,VoiceMail(101@default,u)
 same => n,Hangup()
